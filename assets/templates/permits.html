<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Random Data</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 10px;
            height: 100vh;
        }

        .filter {
            display: flex;
            grid-row: 1 / span 2;
            grid-column: 1 / span auto;
            background-color: #b8f5c7;
            width: 100px;
            justify-content: center;
            align-items: flex-start;
        }

        .permitview {
            display: flex;
            grid-row: 1 / span 1;
            grid-column: 1 / span auto;
            justify-content: center;
            align-items: flex-start;
            height: fit-content;

            background-color: rgb(208, 231, 250);
        }

        .test {
            height: 300px;
            text-align: center;
        }

        .table-wrapper {
            display: flex;
            grid-row: 2 / span 1;
            grid-column: 1 / span auto;
            background-color: rgb(255, 255, 255);
            overflow-y: auto;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1200px;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        #table-wrapper {
            position: relative;
        }

        #table-scroll {
            height: calc(100vh - 50px);
            overflow: auto;
        }
    </style>
</head>

<body>
    <div class="grid-container">

        <div class="permitview" id="permitview">
            <form action="/permits/create" method="POST">
                <div>
                    <label for="PermitID">Permit</label>
                    <input type="text" id="PermitID" name="permit_id" />
               
                    <label for="CompanyName">Company</label>
                    <input type="text" id="CompanyName" name="company_name" />
                </div>
                <div>
                    <label for="Reference">Reference</label>
                    <input type="text" id="Reference" name="reference" />
                </div>
                <div>
                    <label for="DateReceived">Date Received</label>
                    <input type="date" id="DateReceived" name="date_received" />
               
                    <label for="DateDue">Due Date</label>
                    <input type="date" id="DateDue" name="date_due" />
                </div>
                <div>
                    <label for="Designer">Designer</label>
                    <input type="text" id="Designer" name="name" />
                </div>
                <div>
                    <label for="PermitStatus">Permit Status</label>
                    <input type="text" id="PermitStatus" name="permit_status" />
                
                <button type="submit">Create Permit</button>
            </div>
            </form>

        </div>
        <div class="filter" id="filter">
            <p>Filter</p>
        </div>
        <div class="table-wrapper" id="table-wrapper">
            <div >
                <table>
                    <thead>
                        <tr>
                            <th>Permit</th>
                            <th>CompanyName</th>
                            <th>Reference</th>
                            <th>DateReceived</th>
                            <th>DateDue</th>
                            <th>Designer</th>
                            <th>Permit Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        {{range .permits}}
                        <tr>

                            <td>{{.PermitID}}</td>
                            <td>{{.CompanyName}}</td>
                            <td>{{.Reference}}</td>
                            <td>{{.DateReceived}}</td>
                            <td>{{.DateDue}}</td>
                            <td>{{.Designer}}</td>
                            <td>{{.PermitStatus}}</td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
<script onload="">
    const table = document.querySelector('table');

    table.addEventListener('click', async (event) => {
        const clickedRow = event.target.closest('tr');
        if (clickedRow.closest('thead')) {
            console.log("form");
            return
        }
        if (!clickedRow) return;
        console.log(clickedRow.outerText);
        console.log(clickedRow)
        const extractedText = clickedRow.outerText.split('\t')[0];
        console.log("Extracted text:", extractedText);
        const url = 'http://localhost:8000/permit/' + extractedText;
        const response = await fetch(url, {
            method: 'GET'
        });
        console.log(response)
    });
</script>

<div class="permitviewnav">
    <div class="tab">
        <p>Title</p>
    </div>
</div>
